[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codetrail"
version = "0.1.0"
description = "CodeTrail repository skeleton"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Proprietary"}
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "requests>=2.31",
]

authors = [{name = "CodeTrail"}]
keywords = ["github", "cli", "developer-tools", "ai"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: Other/Proprietary License",
]

[project.scripts]
codetrail = "main:app"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "apps/cli/src"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["apps/cli/src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
